name: Dependency Scan

# Reporting only, NOT blocking (continue-on-error below). Known, already-identified
# findings (react-router-dom, vite/vitest/esbuild, pytest, clearml/pyjwt) all
# require major-version upgrades that need real regression testing, tracked as
# separate follow-up work -- making this blocking today would red the pipeline for
# already-known issues rather than catching new ones. Revisit turning this blocking
# once those land.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: pip-audit + npm audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (Python units)
        run: |
          # `|| true` on the pip-audit call: GitHub Actions runs each `run:` block
          # with bash's `-e`, so a non-zero exit (pip-audit's own signal that it
          # found something) would otherwise abort this loop at the first unit
          # with a finding, silently skipping the rest.
          for unit in database api-service ingestion-worker model-training; do
            echo "### $unit" >> "$GITHUB_STEP_SUMMARY"
            (cd "$unit" && uv export --extra test --no-hashes --no-emit-project > /tmp/reqs.txt)
            uv tool run --python 3.12 pip-audit --local -r /tmp/reqs.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm ci
          echo "### frontend (production dependencies)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev | tee -a "$GITHUB_STEP_SUMMARY"
