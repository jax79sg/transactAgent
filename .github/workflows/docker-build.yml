name: Docker Build

# Confirms each service's real Dockerfile still builds -- the same "docker build" a
# deploy would run. database has no image of its own (a shared package, not a
# standalone service) so isn't included.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# These jobs only check out the code and run checks on the runner; they never push, comment or otherwise
# write back to the repository, so the token needs no more than read access (CodeQL:
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-service, ingestion-worker, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
