name: E2E (Nightly)

# Real-browser UI-flow tests (Playwright) against the actual docker-compose stack --
# distinct from test-frontend.yml's jsdom-based vitest suite. Runs nightly, not on
# every push/PR: booting the full stack and driving a real browser is slower and more
# failure-prone than unit tests, so it shouldn't gate every merge. See
# aidlc-docs/audit.md for the full rationale (docker-compose chosen over the K8s
# deployment as the target -- the K8s path needs Vault/ESO/ingress-nginx and an
# OrbStack-specific image-sharing setup that doesn't translate to a CI runner).
#
# Fixture data is seeded directly via SQL (database/src/transactagent_db/
# seed_e2e_fixtures.py), not real ingestion -- ingestion depends on Gemini/omlx/a
# live Drive OAuth connection, none of which exist in CI, and nightly runs shouldn't
# burn real API quota or be flaky because an external LLM was slow. Every env value
# below is a CI-only placeholder; nothing here is a real credential.

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 02:00 SGT
  workflow_dispatch: {}

# This job only checks out code and runs the stack/tests locally on the runner --
# it never pushes, comments, or otherwise writes back to the repo, so GITHUB_TOKEN
# needs no more than read access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  e2e:
    name: UI Flow Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_USER: ci_test_user
      DB_PASSWORD: ci-test-password
      JWT_SECRET: ci-test-jwt-secret
      GOOGLE_OAUTH_CLIENT_ID: ci-dummy.apps.googleusercontent.com
      GOOGLE_OAUTH_CLIENT_SECRET: ci-dummy-oauth-secret
      GOOGLE_DRIVE_FOLDER_ID: ci-dummy-folder-id
      GOOGLE_DRIVE_BACKUP_FOLDER_ID: ci-dummy-backup-folder-id
      GEMINI_API_KEY: ci-dummy-gemini-key
      OPENROUTER_API_KEY: ci-dummy-openrouter-key
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Seed categories and E2E fixtures
        # Runs inside api-service's own container so it uses the exact same
        # transactagent_db/api_service code the running stack does -- no separate
        # dependency install needed. hash_password requires api_service.config's
        # Settings to validate (JWT_SECRET etc.), already set as container env above.
        run: |
          docker compose exec -T api-service python3 -c "
          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session
          from transactagent_db.migrate import build_database_url
          from transactagent_db.seed_categories import seed_categories
          from transactagent_db.seed_e2e_fixtures import seed_e2e_fixtures, E2E_PASSWORD
          from api_service.auth.security import hash_password

          engine = create_engine(build_database_url())
          with Session(engine) as session:
              seed_categories(session)
              seed_e2e_fixtures(session, hashed_password=hash_password(E2E_PASSWORD))
              session.commit()
          print('Fixtures seeded.')
          "

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run UI flow tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8787
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
