name: Guide

# Issue #27: the user guide must always match the release number. Fails when VERSION, the latest guide, the archived
# guides and the releases index disagree (see RELEASING.md for how to cut a release).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Guide matches release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guide, archives and index agree with VERSION
        run: python scripts/guide.py check
      - name: Test the release tool
        run: |
          python -m pip install pytest
          python -m pytest scripts/tests -v
