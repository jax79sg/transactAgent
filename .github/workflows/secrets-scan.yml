name: Secrets Scan

# Blocking. Unlike dependency CVEs (see Dependency Scan workflow), a leaked secret
# is unambiguous and immediately actionable. Scans only the commits in this push/PR,
# not full history (a one-time full-history audit was already done by hand -- see
# .gitleaks.toml's comment on the one real historical finding, already remediated).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
