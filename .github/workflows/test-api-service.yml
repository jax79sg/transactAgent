name: API Service

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Real Postgres via testcontainers -- ubuntu-latest runners have Docker
      # preinstalled and running, no extra setup needed.
      - run: uv sync --extra test
      - name: Lint (ruff)
        run: uv run --with ruff ruff check src tests
      - name: Test
        run: uv run pytest -v
