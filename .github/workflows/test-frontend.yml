name: Frontend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# These jobs only check out the code and run checks on the runner; they never push, comment or otherwise
# write back to the repository, so the token needs no more than read access (CodeQL:
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
