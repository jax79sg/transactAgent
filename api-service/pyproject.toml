[project]
name = "api-service"
version = "0.1.0"
description = "API Service (Unit 2) for the Bank Transaction Insights App"
requires-python = ">=3.12"
dependencies = [
    "transactagent-db",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyjwt>=2.8,<3.0",
    "bcrypt>=4.1,<5.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "google-genai>=0.7,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "testcontainers[postgres]>=4.0,<5.0",
]

[tool.uv.sources]
transactagent-db = { path = "../database", editable = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
