[project]
name = "transactagent-db"
version = "0.1.0"
description = "Shared schema, SQLAlchemy models, and Alembic migrations for the Bank Transaction Insights App (Unit 1: Database)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "testcontainers[postgres]>=4.0,<5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
