apiVersion: v1
kind: ConfigMap
metadata:
  name: transactagent-config
  namespace: {{ .Values.namespace }}
data:
  # Derived from the Ingress host (not duplicated in values.yaml's env map -- see the
  # comment there) so these can never drift out of sync with the real Ingress.
  # /api matches templates/ingress.yaml's routing and frontend's API_BASE_PATH below.
  #
  # FRONTEND_ORIGIN lists BOTH schemes (api-service's CORS config already supports a
  # comma-separated list, per .env.example) rather than picking one: the same Ingress
  # host is reachable two different ways in practice -- OrbStack auto-upgrades it to
  # HTTPS for the machine OrbStack itself runs on (whose cert only that machine
  # trusts), while another device on the network reached via a hosts-file entry has
  # no such upgrade or cert trust and must use plain HTTP. The frontend's own request
  # origin now always matches whichever one actually loaded the page (see
  # frontend/src/config.ts's apiBasePath handling), so CORS just needs to allow both.
  FRONTEND_ORIGIN: "https://{{ .Values.ingress.host }},http://{{ .Values.ingress.host }}"
  # GOOGLE_OAUTH_REDIRECT_URI stays single-valued (Google's OAuth client config only
  # accepts a fixed, pre-registered redirect URI, unlike CORS) -- https, since that's
  # what you register in Google Cloud Console; the Drive-connect flow is expected to
  # be run from the host machine (OrbStack's own HTTPS), not another device.
  GOOGLE_OAUTH_REDIRECT_URI: "https://{{ .Values.ingress.host }}/api/drive/callback"
{{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
