apiVersion: v1
kind: ConfigMap
metadata:
  name: transactagent-config
  namespace: {{ .Values.namespace }}
data:
  # Derived from the Ingress host (not duplicated in values.yaml's env map -- see the
  # comment there) so these can never drift out of sync with the real Ingress.
  # /api matches templates/ingress.yaml's routing and frontend's API_BASE_PATH below.
  #
  # FRONTEND_ORIGIN is single-valued HTTPS now (previously listed both http:// and
  # https:// to work around OrbStack's *.orb.local auto-HTTPS being host-machine-only
  # -- see git history). The Ingress host is now a sslip.io domain with its own
  # self-signed cert (values.yaml's ingress.tls), which every device on the LAN
  # reaches identically over https://, so that split is no longer needed.
  FRONTEND_ORIGIN: "https://{{ .Values.ingress.host }}"
  # GOOGLE_OAUTH_REDIRECT_URI: this is what you register in Google Cloud Console's
  # OAuth client "Authorized redirect URIs". Must be https:// and a public-suffix
  # domain -- see values.yaml's ingress.host comment for why *.orb.local can't be
  # used here at all.
  GOOGLE_OAUTH_REDIRECT_URI: "https://{{ .Values.ingress.host }}/api/drive/callback"
{{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
