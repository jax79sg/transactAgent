# SecretStore: tells the External Secrets Operator (cluster-shared prerequisite, see
# ../../prerequisites/README.md) how to reach this app's Vault. Uses Vault's Kubernetes
# auth method -- ESO authenticates with its own ServiceAccount token, no static Vault
# token stored anywhere (NFR-K8S-2/nfr-design-patterns.md).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStoreName }}
  namespace: {{ .Values.namespace }}
spec:
  provider:
    vault:
      server: {{ .Values.externalSecrets.vaultServer | quote }}
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: transactagent
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# ExternalSecret: syncs the app's secret keys from Vault into one native Secret object,
# consumed by pods via envFrom exactly like today's .env-sourced environment variables.
# This chart never contains a real secret value -- only these path references.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: transactagent-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: transactagent-secrets
    creationPolicy: Owner
  data:
{{- range .Values.externalSecrets.secretKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecrets.vaultPath }}
        property: {{ . }}
{{- end }}
