# ClusterSecretStore (not a namespaced SecretStore): tells the External Secrets
# Operator (cluster-shared prerequisite, see ../../prerequisites/README.md) how to
# reach this app's Vault. Uses Vault's Kubernetes auth method -- ESO authenticates
# with its own ServiceAccount token, no static Vault token stored anywhere
# (NFR-K8S-2/nfr-design-patterns.md).
#
# Two things found only by actually running `helm install` against a live ESO+Vault:
# (1) apiVersion is v1, not v1beta1 -- v1beta1 is still defined in the CRD schema but
#     not `served` by current ESO versions (confirmed via `kubectl get crd ... -o
#     jsonpath=...servedstate`), so a v1beta1 manifest fails with "no matches for kind"
#     even though the CRD technically exists.
# (2) A namespaced SecretStore's admission webhook rejects any serviceAccountRef
#     outside its own namespace ("namespace should either be empty or match the
#     namespace of the SecretStore") -- but ESO's own ServiceAccount lives in the
#     external-secrets namespace, not this app's. ClusterSecretStore is what
#     cross-namespace ServiceAccount references are actually for; this app's real
#     isolation still comes from the Vault policy (secret/data/transactagent only),
#     not from the K8s object's own namespace scope.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStoreName }}
spec:
  provider:
    vault:
      server: {{ .Values.externalSecrets.vaultServer | quote }}
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: transactagent
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# ExternalSecret: syncs the app's secret keys from Vault into one native Secret object,
# consumed by pods via envFrom exactly like today's .env-sourced environment variables.
# This chart never contains a real secret value -- only these path references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transactagent-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: transactagent-secrets
    creationPolicy: Owner
  data:
{{- range .Values.externalSecrets.secretKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecrets.vaultPath }}
        property: {{ . }}
{{- end }}
