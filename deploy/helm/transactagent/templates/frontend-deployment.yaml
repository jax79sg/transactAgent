apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
spec:
  # No `replicas:` field -- owned by the HPA (frontend-hpa.yaml), same reasoning as
  # api-service-deployment.yaml.
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}transactagent-frontend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            # Resolves the frontend's runtime API-URL derivation problem identified in
            # Requirements (k8s-deployment-requirements.md's "Key Design Resolution"):
            # the frontend's default same-host-port logic doesn't work behind a single
            # Ingress. API_BASE_PATH (not API_BASE_URL) is deliberately scheme/host-less
            # -- config.ts combines it with whatever origin the page was actually
            # loaded through, so this works correctly whether reached via OrbStack's
            # auto-upgraded HTTPS (the host machine) or plain HTTP (another device on
            # the network, via a hosts-file entry -- see values.yaml's ingress.scheme
            # comment for why a single fixed scheme can't satisfy both).
            - name: API_BASE_PATH
              value: /api
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
