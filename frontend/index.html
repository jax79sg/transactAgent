<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank Transaction Insights</title>
    <!-- Dark mode (NFR-DM-3): applied synchronously, before first paint, so there's no
         flash of the wrong theme. Mirrors ThemeContext.tsx's own initial-state logic --
         stored explicit choice wins, otherwise falls back to the OS preference. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("transactagent_theme");
          var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage/matchMedia unavailable -- fall back to light mode */
        }
      })();
    </script>
    <!-- Runtime config (NFR Design pattern): generated by docker-entrypoint.sh at
         container startup, not baked in at build time. In local dev, this file
         doesn't exist -- config.ts falls back to a dev default. -->
    <script src="/config.js" onerror="console.warn('config.js not found -- using dev default API base URL')"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
