server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing: any path not matching a real static file
    # falls back to index.html so a hard refresh / direct URL visit to e.g.
    # /transactions works instead of nginx 404-ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js is generated fresh by docker-entrypoint.sh at container startup
    # (NFR Design's Runtime Config pattern) -- never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
