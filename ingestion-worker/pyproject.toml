[project]
name = "ingestion-worker"
version = "0.1.0"
description = "Ingestion Worker Service (Unit 3) for the Bank Transaction Insights App"
requires-python = ">=3.12"
dependencies = [
    "transactagent-db",
    "google-genai>=0.7,<1.0",
    "openai>=1.30,<2.0",
    "google-api-python-client>=2.130,<3.0",
    "google-auth>=2.29,<3.0",
    "pdf2image>=1.17,<2.0",
    "rapidfuzz>=3.9,<4.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "qdrant-client>=1.9,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "hypothesis>=6.100,<7.0",
    "testcontainers[postgres]>=4.0,<5.0",
]

[tool.uv.sources]
transactagent-db = { path = "../database", editable = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Deliberately curated, not ruff's bare defaults (which turned out to enable
# nearly every rule family in this ruff version, including irrelevant ones like
# Python-2-compat checks). See CI workflow comments for how this was chosen.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "C4", "SIM", "RUF", "BLE", "PLW1510", "FURB"]
ignore = [
    "B008",  # FastAPI's Depends()-as-default-argument is the framework's own DI pattern, not a bug
    "DTZ",    # this app has no timezone concept -- deliberately local/naive dates throughout (single-deployment)
    "UP042",  # (str, Enum) -> StrEnum is an unsafe fix per ruff itself -- touches serialization behavior on 16 enum classes
]
# Line length is intentionally not enforced (E5 not selected) -- this codebase
# favors long, dense explanatory comments over wrapping.

