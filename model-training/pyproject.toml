[project]
name = "model-training"
version = "0.1.0"
description = "Model Training (Unit 5) for the Bank Transaction Insights App -- offline dataset curation + categorization-model fine-tuning, not a docker-compose service"
requires-python = ">=3.12"
dependencies = [
    "transactagent-db",
    "mlx-tune>=0.6,<1.0",
    "clearml>=1.16,<2.0",
    "openai>=1.30,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "testcontainers[postgres]>=4.0,<5.0",
]

[tool.uv.sources]
transactagent-db = { path = "../database", editable = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
