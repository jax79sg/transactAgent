[project]
name = "model-training"
version = "0.1.0"
description = "Model Training (Unit 5) for the Bank Transaction Insights App -- offline dataset curation + categorization-model fine-tuning, not a docker-compose service"
requires-python = ">=3.12"
dependencies = [
    "transactagent-db",
    "mlx-tune>=0.6,<1.0",
    "clearml>=2.0,<3.0",
    "openai>=1.30,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "testcontainers[postgres]>=4.0,<5.0",
]

[tool.uv]
# fsspec GHSA-27vj-qcqg-25rc (high, fixed in 2026.6.0): mlx-tune (every release to 0.6.0) requires datasets<4, and
# datasets 3.x requires fsspec<=2025.3.0, so the patched fsspec is unreachable without this override. It overrides a
# declared upper bound, so it is only as safe as datasets 3.6.0 working with a newer fsspec (smoke-tested: local
# files, map/split/save, HTTP via fsspec[http], the Hugging Face filesystem, the unit tests; a real fine-tune run
# was not). The [http] extra is kept: datasets asks for fsspec[http], and dropping it removes aiohttp.
# REMOVE this once mlx-tune accepts datasets>=4 (check by deleting it and running `uv lock`).
override-dependencies = ["fsspec[http]>=2026.6.0"]

[tool.uv.sources]
transactagent-db = { path = "../database", editable = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Deliberately curated, not ruff's bare defaults (which turned out to enable
# nearly every rule family in this ruff version, including irrelevant ones like
# Python-2-compat checks). See CI workflow comments for how this was chosen.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "C4", "SIM", "RUF", "BLE", "PLW1510", "FURB"]
ignore = [
    "B008",  # FastAPI's Depends()-as-default-argument is the framework's own DI pattern, not a bug
    "DTZ",    # this app has no timezone concept -- deliberately local/naive dates throughout (single-deployment)
    "UP042",  # (str, Enum) -> StrEnum is an unsafe fix per ruff itself -- touches serialization behavior on 16 enum classes
]
# Line length is intentionally not enforced (E5 not selected) -- this codebase
# favors long, dense explanatory comments over wrapping.

