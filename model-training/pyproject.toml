[project]
name = "model-training"
version = "0.1.0"
description = "Model Training (Unit 5) for the Bank Transaction Insights App -- offline dataset curation + categorization-model fine-tuning, not a docker-compose service"
requires-python = ">=3.12"
dependencies = [
    "transactagent-db",
    "mlx-tune>=0.6,<1.0",
    "clearml>=2.0,<3.0",
    "openai>=1.30,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10.0",
    "testcontainers[postgres]>=4.0,<5.0",
]

[tool.uv]
# fsspec GHSA-27vj-qcqg-25rc (high, fixed in 2026.6.0) and datasets GHSA-379c-qx7v-6h59 (medium, fixed in 5.0.1):
# mlx-tune (every release to 0.6.0) requires datasets<4, and datasets 3.x requires fsspec<=2025.3.0, so neither patched
# version is reachable without these overrides. They override a declared upper bound (mlx-tune's datasets<4, by two
# major versions), so they are only as safe as mlx-tune working with datasets 5.1: smoke-tested are the calls mlx-tune
# makes (load_dataset on local json, Dataset.from_list, map, train_test_split, save/load, mlx_lm's own loader), HTTP via
# fsspec[http], the Hugging Face filesystem and the unit tests; a real fine-tune run was NOT. fsspec is capped at
# 2026.7.0 because datasets 5.1 accepts fsspec<=2026.7.0; the [http] extra is kept because datasets asks for it and
# dropping it removes aiohttp.
# REMOVE both once mlx-tune accepts datasets>=5 (check by deleting them and running `uv lock`).
override-dependencies = ["fsspec[http]>=2026.6.0,<=2026.7.0", "datasets>=5.0.1"]

[tool.uv.sources]
transactagent-db = { path = "../database", editable = true }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Deliberately curated, not ruff's bare defaults (which turned out to enable
# nearly every rule family in this ruff version, including irrelevant ones like
# Python-2-compat checks). See CI workflow comments for how this was chosen.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "C4", "SIM", "RUF", "BLE", "PLW1510", "FURB"]
ignore = [
    "B008",  # FastAPI's Depends()-as-default-argument is the framework's own DI pattern, not a bug
    "DTZ",    # this app has no timezone concept -- deliberately local/naive dates throughout (single-deployment)
    "UP042",  # (str, Enum) -> StrEnum is an unsafe fix per ruff itself -- touches serialization behavior on 16 enum classes
]
# Line length is intentionally not enforced (E5 not selected) -- this codebase
# favors long, dense explanatory comments over wrapping.

